name: AutoDL
# Created for micromamba. Recreate with:
#   micromamba create -n AutoDL -f environment/autodl_environment.yml
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.19
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - accelerate==1.10.1
      - datasets==4.4.1
      - matplotlib==3.9.4
      - numpy==2.1.2
      - openai==1.99.9
      - pandas==2.3.3
      - python-dotenv==1.1.1
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - sentence-transformers==5.1.2
      - torch==2.4.1+cu118
      - torchvision==0.19.1+cu118
      - tqdm==4.67.1
      - transformers==4.57.3
      - optuna==4.6.0
